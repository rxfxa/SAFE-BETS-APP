*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:17px;line-height:1.35}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(90px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
button{font-family:inherit}
.mono{font-family:'JetBrains Mono',monospace}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:3px solid var(--accent)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;max-width:980px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.4px;flex:none}
.logo svg{width:26px;height:26px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:8px 11px;min-width:0}
.search input{border:0;background:none;outline:none;font:500 15px Inter;color:var(--text);width:100%;min-width:0}
.iconbtn{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mute);display:grid;place-items:center;cursor:pointer}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 12px;max-width:980px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;padding:11px 12px 12px;font-weight:700;font-size:15.5px;color:var(--dim);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--text);border-color:var(--accent2)}
.sub{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 4px;max-width:980px;margin:0 auto}
.sub::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);padding:7px 13px;border-radius:20px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:#000;border-color:var(--accent2)}
main{max-width:980px;margin:0 auto;padding:6px 16px 20px}
.updated{font-size:12px;color:var(--dim);font-weight:600;padding:6px 2px 0;display:flex;gap:6px;align-items:center}
.updated i{width:7px;height:7px;border-radius:50%;background:var(--accent2);display:inline-block}
h2{font-size:17px;font-weight:800;margin:20px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-size:13px;color:var(--dim);font-weight:600}
h2 a{font-size:14px;color:var(--accent);cursor:pointer;font-weight:700}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.mk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.mkhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--dim);font-weight:700;cursor:pointer}
.mkhead .lg{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.badge{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:.3px}
.b-est{background:var(--amberbg);color:var(--amber)}.b-live{background:var(--nobg);color:var(--no)}.b-tag{background:var(--bluebg);color:var(--blue)}
.orow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.orow:first-of-type{border-top:0}
.team{display:flex;align-items:center;gap:9px;min-width:0;cursor:pointer}
.ab{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;letter-spacing:-.2px}
.tn{font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pct{font-weight:800;font-size:19px;min-width:44px;text-align:right}
.yes{border:0;background:var(--yesbg);color:var(--ink);font-weight:800;font-size:14px;border-radius:9px;padding:9px 0;width:78px;cursor:pointer}
.yes.in{background:var(--accent2);color:#000}
.dark .yes{color:var(--text)}.dark .yes.in{background:var(--accent);color:#000}
.yes:disabled{opacity:.45;cursor:default}
.no{border:0;background:var(--nobg);color:var(--no);font-weight:800;font-size:14px;border-radius:9px;padding:9px 0;width:78px;cursor:pointer}
.no.in{background:var(--no);color:#fff}
.bar{display:flex;height:6px;border-radius:4px;overflow:hidden;margin:10px 0 2px;background:var(--soft)}
.bar div{height:100%}
.mkfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--dim);font-weight:600}
.mkfoot a{color:var(--accent);cursor:pointer;font-weight:700}
.final{font-size:13px;font-weight:700;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:40px 18px;font-size:15px;line-height:1.6;background:var(--card);border:1px dashed var(--line);border-radius:14px}
/* parlay cards */
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.pchead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pctitle{font-weight:800;font-size:16px}
.hit{font-weight:800;font-size:13px;padding:4px 9px;border-radius:7px}
.h-hi{background:var(--yesbg);color:var(--yes)}.h-mid{background:var(--bluebg);color:var(--blue)}.h-lo{background:var(--amberbg);color:var(--amber)}
.leg{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.leg:first-of-type{border-top:0}
.legdot{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--soft);color:var(--mute);margin-top:1px}
.legdot.base{background:var(--accent);color:#000}
.legtxt{flex:1;min-width:0}
.legtxt b{display:block;font-size:16px}
.legtxt span{font-size:13.5px;color:var(--dim);font-weight:600}
.legp{font-weight:800;font-size:14px;flex:none}
.link{display:inline-block;font-size:11px;font-weight:800;color:var(--violet);background:var(--violetbg);padding:1px 6px;border-radius:5px;margin-left:4px}
.pcfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.odds{font-weight:800;font-size:18px}
.odds small{display:block;font-size:11.5px;color:var(--dim);font-weight:600}
.btn{border:0;background:var(--accent);color:#000;font:700 15px Inter;border-radius:11px;padding:12px 16px;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.full{width:100%;margin-top:10px}
.why{font-size:13.5px;color:var(--mute);line-height:1.5;margin-top:8px}
.why b{color:var(--text)}
/* slip bar + sheets */
.slipbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;max-width:560px;margin:0 auto;background:#0a0a0a;color:#fff;border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:12px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.slipbar.on{display:flex}
.slipbar .n{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#000;display:grid;place-items:center;font-weight:800}
.slipbar .t{flex:1;font-weight:700;font-size:15px}
.slipbar .t small{display:block;font-size:12px;opacity:.7;font-weight:600}
.bg{position:fixed;inset:0;background:rgba(5,10,18,.5);z-index:40;display:none}
.bg.on{display:block}

.mrow .lbl{font-weight:700;font-size:16px}

.inrow{display:flex;gap:8px;align-items:center}

.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}

.toast.on{transform:translate(-50%,0)}
.note{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:8px}
.labframe{width:100%;height:calc(100vh - 170px);border:1px solid var(--line);border-radius:14px;background:var(--card)}
.playbook{display:grid;gap:10px}
.pb{display:flex;gap:12px;align-items:flex-start}
.pb .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent);color:#000;display:grid;place-items:center;font-weight:800}

.big{font-size:44px;font-weight:800;line-height:1}

.ctrl input[type=range]{flex:1;accent-color:var(--accent2);height:30px}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:9px;font:700 15px Inter;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--accent);color:#000}
.sp{display:inline-flex;align-items:center;justify-content:center;width:22px;font-size:15px}
.warnflag{font-size:11px;font-weight:800;color:var(--amber);background:var(--amberbg);padding:1px 6px;border-radius:5px;margin-left:4px}
.lineup{display:flex;gap:10px;align-items:flex-start;background:var(--bluebg);border-radius:12px;padding:11px 13px;font-size:14px;color:var(--mute);line-height:1.45;margin-bottom:12px}

</style>

let autoCache={};

}
function buildParlay(filter,target,maxLegs,minLegP,maxLegP=.9){

  const base=sorted[0];if(!base||base.p<.7)return null;
  let legs=[{gid:base.gid,key:base.key,label:base.label,sport:base.sport,why:'Base: highest-conviction leg'}];
  let cur=base.p;
  // 2) CONNECT: one leg from the same game that moves with the base
  const same=C.filter(c=>c.gid===base.gid&&c.key!==base.key&&c.group!==base.group);
  let best=null;for(const c of same){const j=probOf(base.g,[base.key,c.key]);const cond=j/cur;if(cond>.985||cond<.8)continue;
    const score=j*Math.log(1/c.p);if(j>=target&&(!best||score>best.score))best={c,j,score,cond};}

  const others=C.filter(c=>!used.has(c.gid)&&c.p>=minLegP&&c.p<=maxLegP).sort((a,b)=>b.p-a.p);
  const sportsSeen=new Set(legs.map(l=>l.sport));

    if(cur*c.p<target)continue;

}

let fz=store.get('fz',{n:6,safe:'safer',sports:['nba','nhl','soccer','nfl','ncaaf']}),fzSeed=0;
const SPORTICON={soccer:'⚽',nba:'🏀',nfl:'🏈',nhl:'🏒',ncaaf:'🎓'};
// opt: {n, sports, minP, target, propsOnly, perPlayer, perGame, seed}
function ticketPool(o,hours){
  const pool=[];const lim=now()+hours*3600e3;
  for(const pl of (DATA.players||[])){const g=gameById(pl.gid);if(!g||!openG(g)||startMs(g)>lim||!o.sports.includes(g.sport)||pl.status!=='active')continue;
    const legs=playerLegs(pl).filter(x=>x.p>=o.minP);if(!legs.length)continue;
    // floor mode: safest line that still clears minP is the highest number with p>=minP; yield mode: line closest to target
    const L=o.target?legs.reduce((b,x)=>Math.abs(x.p-o.target)<Math.abs(b.p-o.target)?x:b):legs.sort((a,b)=>a.p-b.p)[0];
    pool.push({gid:g.id,key:L.key,label:L.label,p:L.p,sport:g.sport,who:pl.name,team:pl.team,stat:pl.stat,kind:'player',boost:pl.boost});}
  if(!o.propsOnly)for(const g of DATA.games){if(!priced(g)||startMs(g)>lim||!o.sports.includes(g.sport))continue;
    const best={};for(const m of marketsFor(g)){const p=p1(g,m.key);if(p<o.minP||p>.95)continue;const sc=o.target?-Math.abs(p-o.target):-p;
      if(!best[m.group]||sc>best[m.group].sc)best[m.group]={gid:g.id,key:m.key,label:m.label,p,sport:g.sport,kind:'game',sc};}
    Object.values(best).forEach(x=>pool.push(x));}
  return pool;
}
function buildTicket(o){
  let hours=36,pool=ticketPool(o,hours);if(pool.length<o.n){hours=24*7;pool=ticketPool(o,hours);}
  else{for(const sp of o.sports){if(!pool.some(x=>x.sport===sp)){const extra=ticketPool({...o,sports:[sp]},24*7);if(extra.length){pool=pool.concat(extra);hours=24*7;}}}}
  let r=(o.seed||0)*7919+13;const rand=()=>{r=(r*9301+49297)%233280;return r/233280;};
  pool.forEach(x=>x.score=(o.target?-Math.abs(x.p-o.target):x.p)+(o.seed?rand()*.06:0)+(x.boost?.02:0));
  const bySport={};pool.sort((a,b)=>b.score-a.score).forEach(x=>(bySport[x.sport]=bySport[x.sport]||[]).push(x));
  const legs=[],perGame={},perWho={};const order=Object.keys(bySport);let guard=0;
  while(legs.length<o.n&&guard++<500){let added=false;
    for(const sp of order){if(legs.length>=o.n)break;const list=bySport[sp];
      const i=list.findIndex(x=>(perGame[x.gid]||0)<o.perGame&&(perWho[x.who]||0)<o.perPlayer&&!(x.kind==='player'&&legs.some(y=>y.kind==='player'&&y.gid===x.gid&&y.team===x.team&&y.stat===x.stat)));
      if(i<0)continue;const x=list.splice(i,1)[0];if(parlayProb([...legs,x]).p<=0)continue;
      legs.push(x);perGame[x.gid]=(perGame[x.gid]||0)+1;if(x.who)perWho[x.who]=(perWho[x.who]||0)+1;added=true;}
    if(!added)break;}
  const pr=parlayProb(legs);return {legs,p:pr.p,hours,n:o.n};
}

function forSure(){

    for(const pl of DATA.players.filter(p=>p.gid===g.id&&p.status==='active')){
      const ok=LADDER[pl.stat].map(t=>({t,p:playerP(pl,t)})).filter(x=>x.p>=.86&&x.p<=.95);
      if(!ok.length)continue; const c=ok.reduce((m,x)=>x.p<m.p?x:m);
      cands.push({pl,gid:g.id,key:`P:${pl.id}:${c.t}`,label:`${pl.name} ${c.t}+ ${STATN[pl.stat]}`,p:c.p});
    }

function renderSlipBar(){
  slip=slip.filter(L=>{const g=gameById(L.gid);return g&&(isP(L.key)?openG(g):priced(g));});
  const on=slip.length>0;$('slipbar').classList.toggle('on',on);if(!on)return;
  const pr=parlayProb(slip);$('slipN').textContent=slip.length;
  $('slipT').innerHTML=`Parlay builder<small>${pct(pr.p)} to hit · tap to open</small>`;$('slipO').textContent=pr.p>0?fmtAm(p2am(pr.p)):'—';
}
$('slipbar').onclick=()=>openSlip();
function openSlip(){
  if(!slip.length){toast('Add legs by tapping a price');return;}
  const pr=parlayProb(slip);
  const legP=slip.map(L=>p1(gameById(L.gid),L.key));
  let bi=slip.findIndex(L=>L.gid+'|'+L.key===baseKey);if(bi<0){bi=legP.indexOf(Math.max(...legP));}
  const base=slip[bi],baseP=legP[bi];
  // order: base first, then same-game legs, then others
  const order=[bi,...slip.map((L,i)=>i).filter(i=>i!==bi).sort((a,b)=>((slip[b].gid===base.gid)-(slip[a].gid===base.gid))||legP[b]-legP[a])];
  const steps=[];for(let k=1;k<=order.length;k++)steps.push(parlayProb(order.slice(0,k).map(i=>slip[i])).p);
  const connected=slip.filter((L,i)=>i!==bi&&slip.some((M,j)=>j!==slip.indexOf(L)&&M.gid===L.gid)).length;
  const boost=pr.indep>0?pr.p/pr.indep:1;const am=p2am(pr.p);
  const tips=[];
  tips.push(baseP>=.75?['ok','✓',`<b>Base:</b> <span>${esc(legLabel(base))} (${pct(baseP)}). Strong start.</span>`]:baseP>=.62?['warn','!',`<b>Base is soft</b> <span>(${pct(baseP)}). Look for a leg you're more sure of, or go smaller.</span>`]:['bad','✗',`<b>No real base.</b> <span>Best leg is only ${pct(baseP)}. Bet a single or a 2-leg instead.</span>`]);
  tips.push(slip.length<=3?['ok','✓',`<b>${slip.length} legs.</b> <span>Small parlays hit far more often.</span>`]:slip.length===4?['warn','!',`<b>4 legs.</b> <span>Still OK, but each extra leg cuts your chances.</span>`]:['bad','✗',`<b>${slip.length} legs is a lot.</b> <span>This is how parlays lose by one leg. Trim the weakest.</span>`]);
  tips.push(pr.p===0?['bad','✗',`<b>Conflicting legs.</b> <span>These can't all win together.</span>`]:connected?['ok','✓',`<b>Connected legs: ${connected}.</b> <span>Same-game legs that move together${boost>1.01?`, worth +${pct(boost-1)} vs. random legs`:boost<.99?`, though some pull against each other (${pct(boost-1)})`:''}.</span>`]:['warn','!',`<b>No connected legs.</b> <span>Try adding a leg from the base's game that helps it win.</span>`]);
  {const seen={},clash=[];for(const L of slip){if(!isP(L.key))continue;const pl=playerById(L.key.split(':')[1]);if(!pl)continue;const k=L.gid+'|'+pl.team+'|'+pl.stat;if(seen[k])clash.push(seen[k]+' and '+pl.name);else seen[k]=pl.name;}
   if(clash.length)tips.push(['bad','✗',`<b>Teammates fighting for the same stat:</b> <span>${esc(clash.join('; '))}. They take from each other, so drop one.</span>`]);}
  tips.push(['ok','$',`<b>Shop the price.</b> <span>Fair odds are <b class="mono">${fmtAm(am)}</b>. Check your books and only bet it if one pays more.</span>`]);
  const weakest=order.slice(1).sort((a,b)=>legP[a]-legP[b])[0];
  openSheet(`<div class="r" style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:20px">Parlay builder</b><button class="btn ghost" id="clearSlip" style="padding:8px 12px;font-size:13.5px">Clear</button></div>
   <div class="panel" style="margin-top:12px"><div class="kpis"><div class="kpi"><b class="mono" style="color:var(--yes)">${pct(pr.p,1)}</b><span>Chance to hit</span></div><div class="kpi"><b class="mono">${pr.p>0?fmtAm(am):'—'}</b><span>Fair odds</span></div><div class="kpi"><b class="mono">${slip.length}</b><span>Legs</span></div></div></div>
   <div class="sec">Legs <span style="text-transform:none;font-weight:600;letter-spacing:0">· ★ = your base</span></div>
   <div class="panel" style="padding:4px 14px">${order.map(i=>{const L=slip[i],g=gameById(L.gid),id=L.gid+'|'+L.key,isB=i===bi,conn=!isB&&L.gid===base.gid;
     return `<div class="leg" style="align-items:center"><button class="star ${isB?'on':''}" data-star="${esc(id)}">★</button><div class="legtxt"><b>${esc(legLabel(L))}${conn?'<span class="link">CONNECTED</span>':''}</b><span>${esc(g.home.abbr)} vs ${esc(g.away.abbr)} · ${esc(when(g))}</span></div><span class="legp mono">${pct(legP[i])}</span><button class="x" data-rm="${esc(id)}">✕</button></div>`;}).join('')}</div>
   <div class="sec">How your chances shrink</div>
   <div class="panel"><div class="steps">${steps.map(p=>`<div style="height:${Math.max(4,p*100)}%"><span>${pct(p)}</span></div>`).join('')}</div><div class="steplbl">${steps.map((p,i)=>`<span>${i+1} leg${i?'s':''}</span>`).join('')}</div>
   ${slip.length>=3&&weakest!=null?`<button class="btn full ghost" id="trimBtn">Trim weakest leg → ${pct(parlayProb(slip.filter((L,i)=>i!==weakest)).p)} to hit</button>`:''}</div>
   <div class="sec">Coach</div><div class="panel" style="padding:4px 14px">${tips.map(([c,i,t])=>`<div class="coach"><span class="ic ${c}">${i}</span><div>${t}</div></div>`).join('')}</div>
   <div class="sec">Check your sportsbook's price</div>
   <div class="panel"><div class="inrow"><input type="text" inputmode="numeric" id="bookOdds" placeholder="e.g. +250"><button class="btn" id="chkBtn">Check</button></div><div id="chkOut" class="why"></div></div>
   <button class="btn full" id="saveP">Save to My Parlays</button><button class="btn full ghost" id="copyP">Copy legs</button>
   <div class="note">Parlay method inspired by RoyBets (@ComboProps). Same-game legs are simulated together ${NSIM.toLocaleString()} times, so connected legs are priced correctly instead of just multiplied.</div>`);
  const S=$('sheetBody');
  S.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const [gid,key]=b.dataset.rm.split('|');toggleLeg(gid,key);if(slip.length)openSlip();else closeSheet();});
  S.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{baseKey=b.dataset.star;saveSlip();openSlip();});
  $('clearSlip').onclick=()=>{slip=[];baseKey=null;saveSlip();renderSlipBar();closeSheet();};
  if($('trimBtn'))$('trimBtn').onclick=()=>{slip.splice(weakest,1);saveSlip();renderSlipBar();openSlip();};
  $('chkBtn').onclick=()=>{const v=parseInt(String($('bookOdds').value).replace(/[^\d-]/g,''),10);if(!v||(v>-100&&v<100)){$('chkOut').innerHTML='Enter American odds like +250 or -120.';return;}
    const ev=pr.p*am2dec(v)-1;$('chkOut').innerHTML=ev>0?`<b style="color:var(--yes)">Value: +${pct(ev,1)}</b> expected return per bet. The book is paying more than the fair ${fmtAm(am)}.`:`<b style="color:var(--no)">No value: ${pct(ev,1)}.</b> The book pays less than fair (${fmtAm(am)}). Shop other books or trim a leg.`;S.dataset.odds=v;};
  $('saveP').onclick=()=>{saved.push({legs:slip.map(L=>({gid:L.gid,key:L.key,label:legLabel(L)})),p:pr.p,odds:+S.dataset.odds||null,at:Date.now()});store.set('saved',saved);toast('Saved to My Parlays');};
  $('copyP').onclick=()=>{const txt=order.map(i=>{const L=slip[i],g=gameById(L.gid);return `${legLabel(L)} (${g.home.abbr} vs ${g.away.abbr})`;}).join('\n')+`\nHit chance ${pct(pr.p)} · fair ${fmtAm(am)}`;
    navigator.clipboard.writeText(txt).then(()=>toast('Copied')).catch(()=>toast('Copy blocked by browser'));};
}

// ---------------- boot ----------------
async function load(){
  let d=null;try{const r=await fetch('data.json',{cache:'no-store'});if(r.ok)d=await r.json();}catch(e){}
  if(!d){try{d=JSON.parse($('seed').textContent);}catch(e){}}
  // player props + built parlays live in props.json so the hourly schedule refresh of data.json never wipes them
  let pr=null;try{const r=await fetch('props.json',{cache:'no-store'});if(r.ok)pr=await r.json();}catch(e){}
  if(d&&d.games){
    if(pr){const ids=new Set((pr.players||[]).map(p=>p.id));d.players=[...(pr.players||[]),...(d.players||[]).filter(p=>!ids.has(p.id))];
      d.picks=pr.picks||d.picks||[];if(pr.lineups)d.lineups=pr.lineups;}
    DATA=d;pCache.clear();autoCache={};}
}
applyTheme();renderTabs();
load().then(()=>{render();renderSlipBar();});
setInterval(()=>{load().then(()=>{if(!$('sheet').classList.contains('on'))render();renderSlipBar();});},10*60*1000);
window.__fm2={get DATA(){return DATA},buildParlay,buildMixed,parlayProb,p1,probOf,marketsFor,render,openSlip,openGame,toggleLeg,get slip(){return slip}};
})();
</script>
