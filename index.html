<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safe Bets — Markets, Parlays & Sharp Alerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f9ff;--card:#ffffff;--soft:#eaf4ff;--line:#cfe3f7;--text:#0a0a0a;--mute:#2c3742;--dim:#5b6878;
--yes:#0a5fb8;--yesbg:#dbeeff;--no:#c62828;--nobg:#fde9e9;--blue:#0a5fb8;--bluebg:#e3f1ff;--amber:#8a5200;--amberbg:#fff2dc;--violet:#0a5fb8;--violetbg:#e3f1ff;
--accent:#8ccfff;--accent2:#4fa9f5;--ink:#0a0a0a;--shadow:0 1px 2px rgba(10,40,80,.06),0 4px 14px rgba(10,60,120,.05);}
.dark{--bg:#0a0d12;--card:#121822;--soft:#18212d;--line:#243243;--text:#f2f7ff;--mute:#b8c4d2;--dim:#8796a8;
--yes:#8ccfff;--yesbg:rgba(140,207,255,.14);--no:#ff7a7a;--nobg:rgba(255,122,122,.13);--blue:#8ccfff;--bluebg:rgba(140,207,255,.13);--amber:#ffc46b;--amberbg:rgba(255,196,107,.12);--violet:#8ccfff;--violetbg:rgba(140,207,255,.13);--accent:#8ccfff;--accent2:#4fa9f5;--ink:#0a0a0a;--shadow:none}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:17px;line-height:1.35}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(90px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
button{font-family:inherit}
.mono{font-family:'JetBrains Mono',monospace}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:3px solid var(--accent)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;max-width:980px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.4px;flex:none}
.logo svg{width:26px;height:26px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:8px 11px;min-width:0}
.search input{border:0;background:none;outline:none;font:500 15px Inter;color:var(--text);width:100%;min-width:0}
.iconbtn{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mute);display:grid;place-items:center;cursor:pointer}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 12px;max-width:980px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;padding:11px 12px 12px;font-weight:700;font-size:15.5px;color:var(--dim);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--text);border-color:var(--accent2)}
.sub{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 4px;max-width:980px;margin:0 auto}
.sub::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);padding:7px 13px;border-radius:20px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:#000;border-color:var(--accent2)}
main{max-width:980px;margin:0 auto;padding:6px 16px 20px}
.updated{font-size:12px;color:var(--dim);font-weight:600;padding:6px 2px 0;display:flex;gap:6px;align-items:center}
.updated i{width:7px;height:7px;border-radius:50%;background:var(--accent2);display:inline-block}
h2{font-size:17px;font-weight:800;margin:20px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-size:13px;color:var(--dim);font-weight:600}
h2 a{font-size:14px;color:var(--accent);cursor:pointer;font-weight:700}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.mk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.mkhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--dim);font-weight:700;cursor:pointer}
.mkhead .lg{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.badge{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:.3px}
.b-est{background:var(--amberbg);color:var(--amber)}.b-live{background:var(--nobg);color:var(--no)}.b-tag{background:var(--bluebg);color:var(--blue)}
.orow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.orow:first-of-type{border-top:0}
.team{display:flex;align-items:center;gap:9px;min-width:0;cursor:pointer}
.ab{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;letter-spacing:-.2px}
.tn{font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pct{font-weight:800;font-size:19px;min-width:44px;text-align:right}
.yes{border:0;background:var(--yesbg);color:var(--ink);font-weight:800;font-size:14px;border-radius:9px;padding:9px 0;width:78px;cursor:pointer}
.yes.in{background:var(--accent2);color:#000}
.dark .yes{color:var(--text)}.dark .yes.in{background:var(--accent);color:#000}
.yes:disabled{opacity:.45;cursor:default}
.no{border:0;background:var(--nobg);color:var(--no);font-weight:800;font-size:14px;border-radius:9px;padding:9px 0;width:78px;cursor:pointer}
.no.in{background:var(--no);color:#fff}
.bar{display:flex;height:6px;border-radius:4px;overflow:hidden;margin:10px 0 2px;background:var(--soft)}
.bar div{height:100%}
.mkfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--dim);font-weight:600}
.mkfoot a{color:var(--accent);cursor:pointer;font-weight:700}
.final{font-size:13px;font-weight:700;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:40px 18px;font-size:15px;line-height:1.6;background:var(--card);border:1px dashed var(--line);border-radius:14px}
/* parlay cards */
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.pchead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pctitle{font-weight:800;font-size:16px}
.hit{font-weight:800;font-size:13px;padding:4px 9px;border-radius:7px}
.h-hi{background:var(--yesbg);color:var(--yes)}.h-mid{background:var(--bluebg);color:var(--blue)}.h-lo{background:var(--amberbg);color:var(--amber)}
.leg{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.leg:first-of-type{border-top:0}
.legdot{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--soft);color:var(--mute);margin-top:1px}
.legdot.base{background:var(--accent);color:#000}
.legtxt{flex:1;min-width:0}
.legtxt b{display:block;font-size:16px}
.legtxt span{font-size:13.5px;color:var(--dim);font-weight:600}
.legp{font-weight:800;font-size:14px;flex:none}
.link{display:inline-block;font-size:11px;font-weight:800;color:var(--violet);background:var(--violetbg);padding:1px 6px;border-radius:5px;margin-left:4px}
.pcfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.odds{font-weight:800;font-size:18px}
.odds small{display:block;font-size:11.5px;color:var(--dim);font-weight:600}
.btn{border:0;background:var(--accent);color:#000;font:700 15px Inter;border-radius:11px;padding:12px 16px;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.full{width:100%;margin-top:10px}
.why{font-size:13.5px;color:var(--mute);line-height:1.5;margin-top:8px}
.why b{color:var(--text)}
/* slip bar + sheets */
.slipbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;max-width:560px;margin:0 auto;background:#0a0a0a;color:#fff;border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:12px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.slipbar.on{display:flex}
.slipbar .n{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#000;display:grid;place-items:center;font-weight:800}
.slipbar .t{flex:1;font-weight:700;font-size:15px}
.slipbar .t small{display:block;font-size:12px;opacity:.7;font-weight:600}
.bg{position:fixed;inset:0;background:rgba(5,10,18,.5);z-index:40;display:none}
.bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding:10px 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.mrow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .lbl{font-weight:700;font-size:16px}
.mrow .lbl small{display:block;color:var(--dim);font-size:12px;font-weight:600}
.mrow .yes,.mrow .no{width:66px;padding:8px 0;font-size:13.5px}
.sec{font-size:12.5px;color:var(--mute);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin:16px 2px 8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi b{display:block;font-size:20px;font-weight:800}
.kpi span{font-size:12px;color:var(--mute);font-weight:600}
.coach{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.coach:first-child{border-top:0}
.coach .ic{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:900}
.ok{background:var(--yesbg);color:var(--yes)}.warn{background:var(--amberbg);color:var(--amber)}.bad{background:var(--nobg);color:var(--no)}
.coach b{color:var(--text)}
.coach span{color:var(--mute)}
.steps{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:10px}
.steps div{flex:1;border-radius:6px 6px 0 0;background:var(--accent2);position:relative;min-height:4px}
.steps div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;font-weight:800;color:var(--mute)}
.steplbl{display:flex;gap:6px;margin-top:4px}.steplbl span{flex:1;text-align:center;font-size:11px;color:var(--dim);font-weight:700}
.inrow{display:flex;gap:8px;align-items:center}
input[type=text],input[type=number]{background:var(--soft);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font:600 16px Inter;width:100%}
.star{border:0;background:none;font-size:17px;cursor:pointer;color:var(--dim);padding:0 2px}
.star.on{color:#f5a524}
.x{border:0;background:var(--soft);color:var(--mute);width:28px;height:28px;border-radius:8px;cursor:pointer;font-weight:800;flex:none}
.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.scores div{background:var(--soft);border-radius:9px;padding:8px 4px;text-align:center}
.scores b{display:block;font-size:16px}
.scores span{font-size:11.5px;color:var(--dim);font-weight:700}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-160%);background:var(--card);color:var(--text);border:2px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;z-index:60;transition:transform .3s;max-width:92vw}
.toast.on{transform:translate(-50%,0)}
.note{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:8px}
.labframe{width:100%;height:calc(100vh - 170px);border:1px solid var(--line);border-radius:14px;background:var(--card)}
.playbook{display:grid;gap:10px}
.pb{display:flex;gap:12px;align-items:flex-start}
.pb .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent);color:#000;display:grid;place-items:center;font-weight:800}
.pb p{font-size:14.5px;line-height:1.5;color:var(--mute)}.pb p b{color:var(--text)}
.fbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.big{font-size:44px;font-weight:800;line-height:1}
.ctrl{display:flex;align-items:center;gap:14px}
.ctrl input[type=range]{flex:1;accent-color:var(--accent2);height:30px}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:9px;font:700 15px Inter;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--accent);color:#000}
.sp{display:inline-flex;align-items:center;justify-content:center;width:22px;font-size:15px}
.warnflag{font-size:11px;font-weight:800;color:var(--amber);background:var(--amberbg);padding:1px 6px;border-radius:5px;margin-left:4px}
.lineup{display:flex;gap:10px;align-items:flex-start;background:var(--bluebg);border-radius:12px;padding:11px 13px;font-size:14px;color:var(--mute);line-height:1.45;margin-bottom:12px}
.lineup b{color:var(--text)}
/* odds format, footer, value tools, correct-score grid */
.oddsel{flex:none;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:700 13px Inter,system-ui,sans-serif;padding:0 4px;cursor:pointer;max-width:64px}
.foot{max-width:980px;margin:0 auto;padding:6px 16px 18px;font-size:12px;color:var(--dim);font-weight:600;text-align:center;line-height:1.5}
.minpx{display:block;font-size:12px;color:var(--mute);font-weight:700;margin-top:3px}
.minpx b{color:var(--text);font-family:'JetBrains Mono',monospace}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl>span{font-size:12px;color:var(--dim);font-weight:700}
.fl input{padding:9px 10px;font-size:15px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kvs{margin-top:10px;display:grid;gap:0}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;color:var(--mute);font-weight:600}
.kv:first-child{border-top:0}
.kv b{color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:800;text-align:right;overflow-wrap:anywhere}
.kv.kpos b{color:var(--yes)}.kv.kneg b{color:var(--no)}
.tools{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.tools{grid-template-columns:1fr 1fr}}
.tools .panel{margin:0}
.tt{font-weight:800;font-size:16px;margin-bottom:4px}
.ts{font-size:12.5px;color:var(--dim);font-weight:600;margin-bottom:10px;line-height:1.45}
.nvt{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px;table-layout:fixed}
.nvt th{color:var(--dim);font-weight:700;text-align:right;padding:4px 2px}.nvt th:first-child{text-align:left}
.nvt td{text-align:right;padding:6px 2px;border-top:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--text);overflow-wrap:anywhere}
.nvt td:first-child{text-align:left;font-family:Inter,system-ui,sans-serif;color:var(--mute)}
.nvt td small{display:block;color:var(--dim);font-weight:600;font-size:11px}
.lrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:8px}
.lpx{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.lpx:first-child{border-top:0}
.lpx .lt{font-size:13.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpx .lt small{display:block;font-size:11.5px;color:var(--dim);font-weight:600}
.lpx input{padding:8px 9px;font-size:14px}
.csg{display:grid;grid-template-columns:22px repeat(5,minmax(0,1fr));gap:4px;margin-top:6px}
.csg .ch{font-size:11px;font-weight:800;color:var(--dim);text-align:center;align-self:center}
.csc{border:1px solid var(--line);border-radius:8px;padding:6px 0;text-align:center;cursor:pointer;color:var(--text);font-family:inherit;min-width:0}
.csc b{display:block;font-size:13px;font-weight:800}
.csc span{display:block;font-size:10.5px;font-weight:700;color:var(--mute)}
.csc.in{outline:2.5px solid var(--text);outline-offset:-2px}
.csc:disabled{cursor:default;opacity:.6}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<header>
  <div class="top">
    <div class="logo"><svg viewBox="0 0 32 32"><path d="M16 2.5l11 4v8.2c0 7-4.7 12.3-11 14.8C9.7 27 5 21.7 5 14.7V6.5z" fill="#8ccfff" stroke="#0a0a0a" stroke-width="2"/><path d="M10.5 15.8l3.8 3.8 7.4-7.6" stroke="#0a0a0a" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Safe&nbsp;Bets</div>
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="color:var(--dim)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Search teams or leagues" autocomplete="off"></label>
    <select class="oddsel" id="oddsFmt" aria-label="Odds format" title="Odds format"></select>
    <button class="iconbtn" id="themeBtn" aria-label="Theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="sub" id="sub"></div>
<main id="main"></main>
<footer class="foot">Hit chances are model estimates, not guarantees. Bet responsibly. 21+.</footer>

<div class="slipbar" id="slipbar"><div class="n" id="slipN">0</div><div class="t" id="slipT">Parlay</div><div class="mono" style="font-weight:800" id="slipO"></div></div>

// ---------------- auto parlays (RoyBets method: base → connect → keep it small) ----------------
let autoCache={};
// anchored = driven directly by provider win chances (Winner / Win by; soccer H, D, A, H2, A2). Correct scores never enter the pool.
function candidates(filter){
  const out=[];for(const g of DATA.games){if(!priced(g)||!inWin(g)||!filter(g))continue;
    for(const m of marketsFor(g)){if(m.nopool)continue;const p=p1(g,m.key);if(p>=.6&&p<=.96)out.push({gid:g.id,key:m.key,p,g,group:m.group,label:m.label,sport:g.sport,anch:!!m.anch});}}
  return out;
}
function buildParlay(filter,target,maxLegs,minLegP,maxLegP=.9){
  const C=candidates(filter);if(!C.length)return null;
  // 1) BASE: most likely leg that still pays something, soonest first on ties
  const sorted=[...C].filter(c=>c.p<=.9&&c.anch).sort((a,b)=>b.p-a.p||startMs(a.g)-startMs(b.g));
  const base=sorted[0];if(!base||base.p<.7)return null;
  let legs=[{gid:base.gid,key:base.key,label:base.label,sport:base.sport,why:'Base: highest-conviction leg'}];
  let cur=base.p;
  // 2) CONNECT: one leg from the same game that moves with the base
  const same=C.filter(c=>c.gid===base.gid&&c.key!==base.key&&c.group!==base.group);
  let best=null;for(const c of same){const j=probOf(base.g,[base.key,c.key]);const cond=j/cur;if(cond>.985||cond<.8)continue;
    const score=j*Math.log(1/c.p);if(j>=target&&(!best||score>best.score))best={c,j,score,cond};}
  if(best){legs.push({gid:best.c.gid,key:best.c.key,label:best.c.label,sport:best.c.sport,why:`Connected to the base (${pct(best.cond)} if the base hits)`});cur=best.j;}
  // 3) BRANCH: add strong legs from other games while we stay above target
  const used=new Set(legs.map(l=>l.gid));
  const others=C.filter(c=>!used.has(c.gid)&&c.p>=minLegP&&c.p<=maxLegP).sort((a,b)=>b.p-a.p);
  const sportsSeen=new Set(legs.map(l=>l.sport));
  for(const c of others){if(legs.length>=maxLegs)break;if(used.has(c.gid))continue;
    if(cur*c.p<target)continue;
    legs.push({gid:c.gid,key:c.key,label:c.label,sport:c.sport,why:'Independent strong leg'});cur*=c.p;used.add(c.gid);sportsSeen.add(c.sport);}
  if(legs.length<2)return null;
  const pr=parlayProb(legs);return {legs,p:pr.p,indep:pr.indep};
}
function mixedFilter(){return ()=>true;}
const PARLAYSETS=[['mixed','Mixed',()=>true],['soccer','Soccer',g=>g.sport==='soccer'],['nba','NBA',g=>g.sport==='nba'],['nfl','NFL',g=>g.sport==='nfl'],['nhl','NHL',g=>g.sport==='nhl'],['ncaaf','College FB',g=>g.sport==='ncaaf']];
function buildMixed(target,maxLegs,minLegP,maxLegP=.9){ // base + connected leg, then the best leg from each other sport
  const start=buildParlay(()=>true,target,2,minLegP);if(!start)return null;
  const legs=start.legs;let cur=start.p;const usedS=new Set(legs.map(l=>l.sport)),usedG=new Set(legs.map(l=>l.gid));
  const bests=SPORTS.map(([s])=>candidates(g=>g.sport===s).filter(c=>c.anch&&c.p<=maxLegP&&c.p>=minLegP&&!usedG.has(c.gid)).sort((a,b)=>b.p-a.p)[0]).filter(Boolean).sort((a,b)=>b.p-a.p);
  for(const b of bests){if(legs.length>=maxLegs)break;if(usedS.has(b.sport)||cur*b.p<target)continue;
    legs.push({gid:b.gid,key:b.key,label:b.label,sport:b.sport,why:`Strongest ${SPORTNAME[b.sport]} leg`});cur*=b.p;usedS.add(b.sport);usedG.add(b.gid);}
  const pr=parlayProb(legs);return {legs,p:pr.p,indep:pr.indep};
}

// ---------------- ticket engine (fantasy, NBA props, high-yield) ----------------
let fz=store.get('fz',{n:6,safe:'safer',sports:['nba','nhl','soccer','nfl','ncaaf']}),fzSeed=0;
const SPORTICON={soccer:'⚽',nba:'🏀',nfl:'🏈',nhl:'🏒',ncaaf:'🎓'};
// opt: {n, sports, minP, target, propsOnly, perPlayer, perGame, seed}
function ticketPool(o,hours){
  const pool=[];const lim=now()+hours*3600e3;
  for(const pl of (DATA.players||[])){const g=gameById(pl.gid);if(!g||!openG(g)||startMs(g)>lim||!o.sports.includes(g.sport)||pl.status!=='active')continue;
    const legs=playerLegs(pl).filter(x=>x.p>=o.minP);if(!legs.length)continue;
    // floor mode: safest line that still clears minP is the highest number with p>=minP; yield mode: line closest to target
    const L=o.target?legs.reduce((b,x)=>Math.abs(x.p-o.target)<Math.abs(b.p-o.target)?x:b):legs.sort((a,b)=>a.p-b.p)[0];
    pool.push({gid:g.id,key:L.key,label:L.label,p:L.p,sport:g.sport,who:pl.name,team:pl.team,stat:pl.stat,kind:'player',boost:pl.boost});}
  if(!o.propsOnly)for(const g of DATA.games){if(!priced(g)||startMs(g)>lim||!o.sports.includes(g.sport))continue;
    const best={};for(const m of marketsFor(g)){const p=p1(g,m.key);if(p<o.minP||p>.95)continue;const sc=o.target?-Math.abs(p-o.target):-p;
      if(!best[m.group]||sc>best[m.group].sc)best[m.group]={gid:g.id,key:m.key,label:m.label,p,sport:g.sport,kind:'game',sc};}
    Object.values(best).forEach(x=>pool.push(x));}
  return pool;
}
function buildTicket(o){
  let hours=36,pool=ticketPool(o,hours);if(pool.length<o.n){hours=24*7;pool=ticketPool(o,hours);}
  else{for(const sp of o.sports){if(!pool.some(x=>x.sport===sp)){const extra=ticketPool({...o,sports:[sp]},24*7);if(extra.length){pool=pool.concat(extra);hours=24*7;}}}}
  let r=(o.seed||0)*7919+13;const rand=()=>{r=(r*9301+49297)%233280;return r/233280;};
  pool.forEach(x=>x.score=(o.target?-Math.abs(x.p-o.target):x.p)+(o.seed?rand()*.06:0)+(x.boost?.02:0));
  const bySport={};pool.sort((a,b)=>b.score-a.score).forEach(x=>(bySport[x.sport]=bySport[x.sport]||[]).push(x));
  const legs=[],perGame={},perWho={};const order=Object.keys(bySport);let guard=0;
  while(legs.length<o.n&&guard++<500){let added=false;
    for(const sp of order){if(legs.length>=o.n)break;const list=bySport[sp];
      const i=list.findIndex(x=>(perGame[x.gid]||0)<o.perGame&&(perWho[x.who]||0)<o.perPlayer&&!(x.kind==='player'&&legs.some(y=>y.kind==='player'&&y.gid===x.gid&&y.team===x.team&&y.stat===x.stat)));
      if(i<0)continue;const x=list.splice(i,1)[0];if(parlayProb([...legs,x]).p<=0)continue;
      legs.push(x);perGame[x.gid]=(perGame[x.gid]||0)+1;if(x.who)perWho[x.who]=(perWho[x.who]||0)+1;added=true;}
    if(!added)break;}
  const pr=parlayProb(legs);return {legs,p:pr.p,hours,n:o.n};
}
function ticketCard(id,title,T,sub){
  if(T.legs.length<T.n)return `<div class="pc"><div class="pchead"><span class="pctitle">${title}</span></div><div class="why">Only ${T.legs.length} qualifying legs right now. More games load as the day goes on.</div></div>`;

  return `<div class="pc"><div class="pchead"><span class="pctitle">${title}</span><span class="hit ${hc}">${T.p>=.01?pct(T.p):pct(T.p,1)} to hit</span></div>${sub?`<div class="why" style="margin-top:4px">${sub}</div>`:''}

     return `<div class="leg"><span class="sp">${SPORTICON[g.sport]}</span><div class="legtxt"><b>${esc(L.label)}${pi&&pi.pl.boost?'<span class="link">NEXT MAN UP</span>':''}</b><span>${esc(g.away.abbr)} @ ${esc(g.home.abbr)} · ${esc(when(g))}</span></div><span class="legp mono">${pct(L.p)}</span></div>`;}).join('')}</div>
   <div class="pcfoot"><div class="odds mono">${fmtOdds(T.p)}<small>Fair odds · $10 pays ~$${pay.toLocaleString()}</small></div><button class="btn" data-addp="${id}">Open in builder</button></div><div class="note">${minPriceLine(T.p)}</div></div>`;

function forSure(){
  const games=[...new Set((DATA.players||[]).map(p=>p.gid))].map(gameById).filter(g=>g&&g.sport==='nba'&&openG(g)).sort((a,b)=>startMs(a)-startMs(b));
  const out=[];
  for(const g of games){
    const cands=[];
    for(const pl of DATA.players.filter(p=>p.gid===g.id&&p.status==='active')){
      const ok=LADDER[pl.stat].map(t=>({t,p:playerP(pl,t)})).filter(x=>x.p>=.86&&x.p<=.95);
      if(!ok.length)continue; const c=ok.reduce((m,x)=>x.p<m.p?x:m);
      cands.push({pl,gid:g.id,key:`P:${pl.id}:${c.t}`,label:`${pl.name} ${c.t}+ ${STATN[pl.stat]}`,p:c.p});
    }
    cands.sort((a,b)=>b.p-a.p);
    const legs=[];
    for(const c of cands){ if(legs.length>=3)break;
      if(legs.some(l=>l.pl.name===c.pl.name))continue;
      if(legs.some(l=>l.pl.team===c.pl.team&&l.pl.stat===c.pl.stat))continue;
      legs.push(c);}
    if(legs.length>=2){const T=parlayProb(legs.map(({gid,key,label,p})=>({gid,key,label,p})));out.push({g,legs,p:T.p});}
  }
  return out;
}

    const out=$('naiveOut');

    const e=ev(p,prod);
    out.innerHTML=`<div class="kv"><span>Book's multiplied price</span><b>${fmtPrice(prod)}</b></div>
      <div class="kv"><span>Our fair price (correlation-aware)</span><b>${p>0?fmtOdds(p):'—'}</b></div>
      <div class="kv"><span>Fair if legs were unrelated</span><b>${pr.indep>0?fmtOdds(pr.indep):'—'}</b></div>
      <div class="kv ${e>0?'kpos':'kneg'}"><span>EV at the multiplied price</span><b>${signPct(e)}</b></div>
      <div class="why" style="margin-top:6px">${e>0?`Multiplying these legs pays <b>more</b> than our fair price${boost>1.01?' because they tend to win together':''}. Worth it only if your book really offers that combined price; many books reprice same-game parlays.`:`Multiplied, these legs pay <b>less</b> than our fair price${boost<.99?' (they pull against each other)':''}. No value at these leg prices.`}</div>`;};
  $('bookOdds').oninput=e=>{bookPx=e.target.value;check();};
  $('chkBtn').onclick=check;
  $('bankroll').oninput=e=>{bankroll=Math.max(0,+e.target.value||0);store.set('bankroll',bankroll);check();};
  $('kfrac').oninput=e=>{const v=+e.target.value;if(v>=0&&v<=1){kfrac=v;store.set('kellyFrac',kfrac);check();}};
  S.querySelectorAll('[data-lpx]').forEach(inp=>inp.oninput=()=>{legPx[inp.dataset.lpx]=inp.value;naive();});
  check();naive();
  $('saveP').onclick=()=>{const dec=+S.dataset.dec||null;saved.push({legs:slip.map(L=>({gid:L.gid,key:L.key,label:legLabel(L)})),p:pr.p,odds:dec?dec2am(dec):null,dec,at:Date.now()});store.set('saved',saved);toast('Saved to My Parlays');};
  $('copyP').onclick=()=>{const txt=order.map(i=>{const L=slip[i],g=gameById(L.gid);return `${legLabel(L)} (${g.home.abbr} vs ${g.away.abbr})`;}).join('\n')+`\nHit chance ${pct(pr.p)} (model estimate) · fair ${fmtOdds(pr.p)}`;
    navigator.clipboard.writeText(txt).then(()=>toast('Copied')).catch(()=>toast('Copy blocked by browser'));};
}

function noVig(decs,method){ // fair probabilities from a book's prices. methods: multiplicative | additive | power | shin
  const q=decs.map(d=>1/d),S=q.reduce((a,b)=>a+b,0),n=q.length;
  if(method==='additive'){const r=q.map(x=>Math.max(1e-6,x-(S-1)/n)),t=r.reduce((a,b)=>a+b,0);return r.map(x=>x/t);}
  if(method==='power'){let lo=.01,hi=50;for(let i=0;i<80;i++){const k=(lo+hi)/2,t=q.reduce((a,x)=>a+Math.pow(x,k),0);t>1?lo=k:hi=k;}const k=(lo+hi)/2;return q.map(x=>Math.pow(x,k));}
  if(method==='shin'){const f=z=>q.map(x=>(Math.sqrt(z*z+4*(1-z)*x*x/S)-z)/(2*(1-z)));let lo=-.9,hi=.9;for(let i=0;i<80;i++){const z=(lo+hi)/2,t=f(z).reduce((a,b)=>a+b,0);t>1?lo=z:hi=z;}return f((lo+hi)/2);}
  return q.map(x=>x/S);}
function parseProb(str){const s=String(str??'').trim().replace(/\s/g,'');if(!s)return null;const hasP=s.endsWith('%');const v=parseFloat(s);if(!isFinite(v))return null;const p=hasP||v>=1?v/100:v;return p>0&&p<1?p:null;}
const OT=Object.assign({conv:'+150',nvN:2,nv2:['-110','-110'],nv3:['+150','+240','+190'],evP:'55%',evO:'+100',par:[{o:'-110',p:''},{o:'-110',p:''},{o:'+150',p:''}],parStake:'10',arbN:2,arb:['+105','+102','+300'],arbStake:'100',hS:'10',hO:'+400',hH:'-150'},store.get('otools',{}));
if(!Array.isArray(OT.par)||!OT.par.length)OT.par=[{o:'-110',p:''},{o:'-110',p:''}];
const saveOT=()=>store.set('otools',OT);
function setOT(f,v){
  if(f==='bankroll'){bankroll=Math.max(0,+v||0);store.set('bankroll',bankroll);return;}
  if(f==='kfrac'){const x=+v;if(x>=0&&x<=1){kfrac=x;store.set('kellyFrac',kfrac);}return;}
  const [a,b,c]=f.split('.');
  if(a==='nv')(OT.nvN===3?OT.nv3:OT.nv2)[+b]=v;else if(a==='par'){if(OT.par[+b])OT.par[+b][c]=v;}else if(a==='arb')OT.arb[+b]=v;else OT[a]=v;
  saveOT();}

     <div class="kvs" id="o-par"></div></div>

     <div class="kvs" id="o-arb"></div></div>

     <div class="tgrid3"><label class="fl"><span>Your stake ($)</span>${inp('hS',OT.hS,'10')}</label><label class="fl"><span>Your bet's price</span>${inp('hO',OT.hO,'+400')}</label><label class="fl"><span>Hedge price</span>${inp('hH',OT.hH,'-150')}</label></div>
     <div class="kvs" id="o-hedge"></div></div>

  <div class="note">These tools only do maths on the prices you type. They can't change what a sportsbook pays; they show where a price beats fair value. Hit chances are model estimates or your own inputs.</div>`;

    if(e.target.closest('[data-paradd]')&&OT.par.length<15){OT.par.push({o:'',p:''});saveOT();renderOddsTools(M);}});
  calcOT();

function calcOT(){
  const kv=(l,v,c='')=>`<div class="kv ${c}"><span>${l}</span><b>${v}</b></div>`,bad=m=>`<div class="why">${m}</div>`,need='Enter odds like +150, -120, 2.5, 3/2 or 40%.';
  const set=(id,h)=>{const el=$(id);if(el)el.innerHTML=h;};
  // converter
  {const d=parseOdds(OT.conv);set('o-conv',d?kv('American',fmtPrice(d,'american'))+kv('Decimal',d.toFixed(3).replace(/0$/,''))+kv('Fractional',fmtPrice(d,'fractional'))+kv('Implied chance',pct(1/d,2))+kv('Profit on $100',money(100*(d-1))):bad(need));}
  // no-vig
  {const vals=(OT.nvN===3?OT.nv3:OT.nv2).map(parseOdds);
   if(vals.some(x=>!x))set('o-nv',bad(need));else{
    const S=vals.reduce((a,d)=>a+1/d,0),names=OT.nvN===3?['Home','Draw','Away']:['Side A','Side B'];
    const meth=[['multiplicative','Mult'],['additive','Add'],['power','Power'],['shin','Shin']].map(([k,l])=>[l,noVig(vals,k)]);
    set('o-nv',`<div class="kvs">${kv('Overround (book margin)',signPct(S-1,2),S>1?'':'kpos')}${kv('Hold',pct(1-1/S,2))}</div>
     <table class="nvt"><thead><tr><th>Side</th><th>Book</th>${meth.map(([l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${names.map((n,i)=>`<tr><td>${n}</td><td>${pct(1/vals[i],1)}<small>${fmtPrice(vals[i])}</small></td>${meth.map(([,P])=>`<td>${pct(P[i],1)}<small>${fmtOdds(P[i])}</small></td>`).join('')}</tr>`).join('')}</tbody></table>
     <div class="note">Mult = proportional. Add = equal margin off each side. Power and Shin take more margin off longshots (favourite-longshot bias). Fair prices shown in your odds format.</div>`);}}
  // EV + Kelly
  {const p=parseProb(OT.evP),d=parseOdds(OT.evO);
   if(!p)set('o-ev',bad('Enter your hit chance, like 55% or 0.55.'));else if(!d)set('o-ev',bad(need));else{
    const e=ev(p,d),st=bankroll*kelly(p,d,kfrac);
    set('o-ev',kv('Expected value per $1',signPct(e),e>0?'kpos':'kneg')+kv('Edge vs. break-even',`${p-1/d>=0?'+':'−'}${Math.abs((p-1/d)*100).toFixed(1)} pts`,e>0?'kpos':'kneg')+kv('Break-even chance at this price',pct(1/d,1))+kv('Fair price for your chance',fmtOdds(p))+kv('Min price for +EV',fmtOdds(p)+' or better')+kv('Min price for a 5% edge',fmtPrice(1.05/p)+' or better')+kv('Full Kelly',pct(kelly(p,d,1),1)+' of bankroll')+kv(`Stake at ${kfrac}× Kelly`,st>0?money(st):'No bet'));}}
  // parlay
  {const L=OT.par.map(x=>({d:parseOdds(x.o),p:parseProb(x.p),raw:x.o}));const ok=L.filter(x=>x.d);
   if(!ok.length)set('o-par',bad(need));else{
    const D=ok.reduce((a,x)=>a*x.d,1),stake=+String(OT.parStake).replace(/[^\d.]/g,'')||0,allP=ok.every(x=>x.p);
    let h=kv('Legs counted',`${ok.length} of ${L.length}`)+kv('Combined price',fmtPrice(D))+kv("Book's implied chance",pct(1/D,2))+kv(`Payout on ${money(stake)}`,money(stake*D))+kv('Profit if it hits',money(stake*(D-1)));
    if(allP){const P=ok.reduce((a,x)=>a*x.p,1),e=ev(P,D);h+=kv('Your hit chance (legs unrelated)',pct(P,2))+kv('Fair price',fmtOdds(P))+kv('Expected value per $1',signPct(e),e>0?'kpos':'kneg');}
    set('o-par',h+(allP?'':`<div class="note">Add your chance for every leg to see EV. Same-game legs aren't independent: use the parlay builder for those.</div>`));}}
  // arbitrage
  {const n=OT.arbN===3?3:2,vals=OT.arb.slice(0,n).map(parseOdds),T=+String(OT.arbStake).replace(/[^\d.]/g,'')||0;
   if(vals.some(x=>!x))set('o-arb',bad(need));else{
    const S=vals.reduce((a,d)=>a+1/d,0),ret=T/S;
    set('o-arb',kv('Implied chances add to',pct(S,2),S<1?'kpos':'kneg')+(S<1?kv('Arbitrage profit',`${signPct(1/S-1,2)} · ${money(ret-T)}`,'kpos'):kv('No arbitrage',`books keep ${pct(S-1,2)}`,'kneg'))+
     vals.map((d,i)=>kv(`Stake outcome ${i+1} (${fmtPrice(d)})`,money(T*(1/d)/S))).join('')+kv('Return whatever happens',money(ret),S<1?'kpos':'kneg'));}}
  // hedge
  {const S=+String(OT.hS).replace(/[^\d.]/g,'')||0,o1=parseOdds(OT.hO),o2=parseOdds(OT.hH);
   if(!o1||!o2)set('o-hedge',bad(need));else{
    const H=S*o1/o2,eq=S*o1-S-H,H0=S/(o2-1);
    set('o-hedge',kv('Equal-profit hedge stake',money(H))+kv('Profit either way',money(eq),eq>=0?'kpos':'kneg')+
      kv('Break-even hedge stake',money(H0))+kv('…profit if your bet wins',money(S*(o1-1)-H0),'kpos')+kv('…if the hedge wins',money(0))+
      kv('No hedge: win / lose',`${money(S*(o1-1))} / ${money(-S)}`));}}
}

/* ================= window.SB — shared module API (version 2) =================
   Contract between index.html and modules (soccer.js, sim.js). index.html loads them with plain <script src> tags after
   its main script; a missing module file must not break the app. The first render waits for DOMContentLoaded, so a
   module's top-level registerTab / registerLegType calls are in place before anything is drawn.

   SB.version = 2            SB.NSIM = 100000 (Monte-Carlo runs per game, margin sports)
   SB.DATA (getter)          {updated, games, players, picks, lineups, scorers}; scorers = parsed scorers.json or null.
                             DATA is replaced (new object, new game objects) on every data load: re-read it, don't cache games.
   helpers                   $(id), esc(s), clamp(x,a,b), pct(p,d=0), when(g), abBox(team), toast(html), store.get(k,def)/store.set(k,v)
                             (localStorage, prefix "fm2."), startMs(g), started(g), isFinal(g), priced(g) (has prob, not started),
                             openG(g) (not started), gameById(id)
   odds                      SB.oddsFormat (getter: 'american'|'decimal'|'fractional'|'prob'), setOddsFormat(f) (persists 'oddsFmt',
                             re-renders, emits 'oddsformat'), fmtOdds(p[,fmt]) fair price for probability p, fmtPrice(dec[,fmt]) a
                             decimal price, p2am(p) -> int, am2dec(a), p2dec(p), dec2p(d), dec2am(d), fmtAm(a),
                             parseOdds(str) -> decimal or null ("+250" 3.5, "-120" 1.833, "2.5", "3/2" 2.5, "40%" 2.5, "evens" 2;
                             a bare number >= 100 is read as American), ev(p,dec) = p*dec-1, kelly(p,dec,fraction=1) = bankroll share,
                             noVig(decs, 'multiplicative'|'additive'|'power'|'shin') -> fair probabilities
   model                     fit(g) -> null | goals {kind:'goals', lh, la, rho, diag, otHome?(NHL), method, err}
                                     | margin {kind:'margin', mu, sd, T, tsd}
                             scoreMatrix(g) -> null | {n:11, P:Float64Array(121) (P[h*11+a], sums to 1), lh, la, rho, eh, ea,
                                     otHome?, regulation?}. Soccer = full time. NHL = REGULATION grid; ties go to OT/SO, home wins
                                     those with prob otHome and the winner gets +1 goal in the final score.
                             outcomes(g) -> {h:Int8Array, a:Int8Array, p:Float64Array, n} final-score outcomes (soccer = grid
                                     cells; NHL = grid with ties split into OT wins). Joints are sums over these.
                             simGame(g) -> {N, mg:Float32Array (home margin), tt:Float32Array (total), seed} margin sports only,
                                     100,000 runs, mulberry32 seeded by hashStr(g.id) -> identical on every reload. rng(seed),
                                     hashStr(s) are exported for modules that want their own seeded sims.
                             marketsFor(g) -> [{group, key, label, desc, f, anch?, nopool?, cs?}]   (f(h,a) for goals sports on
                                     the final score; f(margin,total) for margin sports)
                             p1(g,key) single-leg chance (cached); probOf(g, keys) joint chance that all keys of ONE game hit
                                     (exact for soccer / NHL; 100k sims for margin sports); parlayProb(legs) -> {p, indep}
                                     (games multiplied; indep = plain product of single-leg chances); legLabel(leg);
                             evalMarket(g,key,h,a) -> true|false|null settles a key for final score h-a.
                             registerLegType(prefix, handler) -> bool. Keys "<prefix>:<rest>" (e.g. "G:haaland-mci"); "P" and "U"
                                     are reserved (player props). handler = {
                                       label(key, g) -> string,
                                       prob(g, key) -> p                          (single-leg chance; used by p1 and the UI),
                                       cond?(g, key) -> (h,a) => P(leg hits | final score h-a),
                                       condMany?(g, keys) -> (h,a) => P(all of these legs hit | final score h-a),
                                       settle?(g, key, h, a) -> true|false|null   (optional, used to grade saved parlays) }
                                     Same-game joint for goals sports = Σ over outcomes P(h,a) · Π[match markets 0/1] · Π
                                     custom factors, where each prefix with condMany contributes ONE factor for all its keys in
                                     that game, else each key contributes cond(g,key)(h,a); a key whose type has neither is
                                     multiplied in independently via prob(). For NHL, (h,a) is the final score incl. the OT
                                     goal. For margin sports custom legs are always independent. Keep prob consistent with cond:
                                     prob(g,k) ≈ Σ P(h,a)·cond(g,k)(h,a). Handler exceptions are caught (leg treated as 0 / indep).
   slip                      SB.slip (getter, array of {gid,key,label,sport}), toggleLeg(gid,key) -> true if added, inSlip(gid,key),
                             setSlip(legs, baseKey?) (baseKey = "gid|key", defaults to first leg), openSlip(), renderSlipBar(),
                             openGame(gid). A custom leg is addable while its game hasn't started and its type is registered.
   ui                        registerTab({key, label, after?, render(mainEl, params)}) adds a top-level tab after tab `after`
                             (else at the end); re-registering a key replaces it. goTab(key, params) switches tab (closes any
                             sheet) and calls render(mainEl, params); a plain tab click passes {}. render() redraws the view.
                             openSheet(html), closeSheet() bottom sheet helpers.
                             on(event, fn) -> unsubscribe fn. Events: 'data' (DATA, after every data load; a late subscriber
                             gets one call right away), 'slip' (slip array), 'oddsformat' (format), 'theme' ('light'|'dark').
   Built-in tab keys: trending, props, fantasy, parlays, odds, soccer, nba, nfl, nhl, ncaaf, mine, lab.
   window.__fm2 is the older debug export and stays.

const SB={version:2,NSIM,
  get DATA(){return DATA},
  $,esc,clamp,pct,when,abBox,toast,store,startMs,started,isFinal,priced,openG,gameById,
  get oddsFormat(){return oddsFmt},setOddsFormat,fmtOdds,fmtPrice,p2am,am2dec,p2dec,dec2p,dec2am,fmtAm,parseOdds,ev,kelly,noVig,
  fit,scoreMatrix,outcomes,simGame:sim,rng:mulberry32,hashStr,marketsFor,p1,probOf,parlayProb,legLabel,evalMarket,registerLegType,
  get slip(){return slip},toggleLeg,inSlip,setSlip,openSlip,renderSlipBar,openGame,
  registerTab,goTab,render,on,openSheet,closeSheet:()=>closeSheet()};
window.SB=SB;

// ---------------- boot ----------------
async function load(){
  const get=async f=>{try{const r=await fetch(f,{cache:'no-store'});if(r.ok)return await r.json();}catch(e){}return null;};
  // data.json = games feed; props.json = player props + built parlays (kept apart so the hourly data.json refresh never wipes them);
  // scorers.json = optional goalscorer data for the soccer module (DATA.scorers = null when missing)
  let [d,pr,sc]=await Promise.all([get('data.json'),get('props.json'),get('scorers.json')]);
  if(!d){try{d=JSON.parse($('seed').textContent);}catch(e){}}
  if(d&&d.games){
    if(pr){const ids=new Set((pr.players||[]).map(p=>p.id));d.players=[...(pr.players||[]),...(d.players||[]).filter(p=>!ids.has(p.id))];
      d.picks=pr.picks||d.picks||[];if(pr.lineups)d.lineups=pr.lineups;}
    d.players=d.players||[];d.picks=d.picks||[];d.lineups=d.lineups||null;d.scorers=sc||null;
    DATA=d;pCache.clear();autoCache={};dataLoaded=true;emit('data',DATA);}
}
registerTab({key:'odds',label:'💰 Odds Tools',after:'parlays',render:renderOddsTools});
applyTheme();renderTabs();
const domReady=document.readyState==='loading'?new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true})):Promise.resolve();
Promise.all([load(),domReady]).then(()=>{const t0=performance.now();render();renderSlipBar();SB.firstRender={at:performance.now(),ms:performance.now()-t0};});
setInterval(()=>{load().then(()=>{if(!sheetOpen())render();renderSlipBar();});},10*60*1000);
window.__fm2={get DATA(){return DATA},buildParlay,buildMixed,parlayProb,p1,probOf,marketsFor,render,openSlip,openGame,toggleLeg,get slip(){return slip}};
})();
</script>
