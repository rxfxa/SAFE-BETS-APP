// standard UK bookmaker fractions (what a punter expects to see: -110 = 10/11, 2.05 = 21/20)
const FRAC_LADDER='1/100 1/50 1/33 1/25 1/20 1/16 1/14 1/12 1/10 1/9 1/8 1/7 1/6 1/5 2/9 1/4 2/7 3/10 1/3 4/11 2/5 4/9 1/2 8/15 4/7 8/13 4/6 8/11 4/5 5/6 10/11 20/21 1/1 21/20 11/10 6/5 5/4 11/8 3/2 13/8 7/4 15/8 2/1 9/4 5/2 11/4 3/1 10/3 7/2 4/1 9/2 5/1 11/2 6/1 13/2 7/1 15/2 8/1 17/2 9/1 10/1 11/1 12/1 14/1 16/1 18/1 20/1 25/1 33/1 40/1 50/1 66/1 80/1 100/1 125/1 150/1 200/1 250/1 300/1 400/1 500/1 750/1 1000/1'
  .split(' ').map(t=>{const [n,d]=t.split('/').map(Number);return [n,d,n/d];});
function fracStr(x){ // x = decimal-1 > 0 -> the nearest ladder rung AT OR ABOVE x within 2%, else the smallest-denominator fraction
  // at or above x within 1% (best up to /100). Rounding up keeps "bet only at X or better" from ever naming a price under break-even.
  let r=null;for(const L of FRAC_LADDER){if(L[2]<x*(1-1e-9))continue;const e=(L[2]-x)/x;if(!r||e<r.e)r={L,e};}

const ODDSFMTS=[['american','US','American (+150)'],['decimal','Dec','Decimal (2.50)'],['fractional','Frac','Fractional (3/2)'],['prob','%','Probability (40%)']];

function fmtPrice(dec,fmt){ // a decimal price -> string in the current (or given) odds format
  const f=fmt||oddsFmt;if(!(dec>1)||!isFinite(dec))return '—';

function parseOdds(str,fmt){ // any format -> decimal price (>1) or null. +250 / -120 American, 2.5 decimal, 3/2 fractional, 40% probability, "evens"
  // fmt (default: the user's odds format) only decides what a BARE unsigned number means: American 150 = +150, decimal 150 = 150.0,
  // probability 40 = 40%. Signed numbers are always American. "1,85" is a decimal comma; "2,000" is a thousands separator.
  const f=ODDSFMTS.some(x=>x[0]===fmt)?fmt:oddsFmt;let s=String(str??'').trim().toLowerCase().replace(/[−–]/g,'-');

  if((m=s.match(/^(\d*\.?\d+)$/))){const v=+m[1];
    if(f==='prob')return v>0&&v<100?100/v:null;          // bare 40 in % mode = 40%
    if(f==='american'&&v>=100)return 1+v/100;             // bare 150 in American mode = +150

  return null;}

/* SOCCER = exact Dixon-Coles (1997) score matrix.

   Grid is 0..10 goals per side (11×11), renormalised to sum to exactly 1.
   FITTING (deterministic, ~1-3 ms per game, memoised by the provider numbers + league):
   The provider gives two free numbers (home, draw; away = rest). A draw price alone is a poor guide to the total: books shade the

     method 'draw+league prior' (normal case):

          δ ∈ [−0.6, 0.6] (draw cells × (1+δ)) is bisected instead, so 1X2 is still reproduced exactly.

let autoCache={};
// anchored = driven directly by provider win chances (Winner / Win by; soccer H, D, A, H2, A2). Correct scores never enter the pool.
function candidates(filter){
  const out=[];for(const g of DATA.games){if(!priced(g)||!inWin(g)||!filter(g))continue;
    for(const m of marketsFor(g)){if(m.nopool)continue;const p=p1(g,m.key);if(p>=.6&&p<=.96)out.push({gid:g.id,key:m.key,p,g,group:m.group,label:m.label,sport:g.sport,anch:!!m.anch});}}
  return out;
}
function buildParlay(filter,target,maxLegs,minLegP,maxLegP=.9){
  const C=candidates(filter);if(!C.length)return null;
  // 1) BASE: most likely leg that still pays something, soonest first on ties
  const sorted=[...C].filter(c=>c.p<=.9&&c.anch).sort((a,b)=>b.p-a.p||startMs(a.g)-startMs(b.g));
  const base=sorted[0];if(!base||base.p<.7)return null;
  let legs=[{gid:base.gid,key:base.key,label:base.label,sport:base.sport,why:'Base: highest-conviction leg'}];
  let cur=base.p;
  // 2) CONNECT: one leg from the same game that moves with the base
  const same=C.filter(c=>c.gid===base.gid&&c.key!==base.key&&c.group!==base.group);
  let best=null;for(const c of same){const j=probOf(base.g,[base.key,c.key]);const cond=j/cur;if(cond>.985||cond<.8)continue;
    const score=j*Math.log(1/c.p);if(j>=target&&(!best||score>best.score))best={c,j,score,cond};}
  if(best){legs.push({gid:best.c.gid,key:best.c.key,label:best.c.label,sport:best.c.sport,why:`Connected to the base (${pct(best.cond)} if the base hits)`});cur=best.j;}
  // 3) BRANCH: add strong legs from other games while we stay above target
  const used=new Set(legs.map(l=>l.gid));
  const others=C.filter(c=>!used.has(c.gid)&&c.p>=minLegP&&c.p<=maxLegP).sort((a,b)=>b.p-a.p);
  const sportsSeen=new Set(legs.map(l=>l.sport));
  for(const c of others){if(legs.length>=maxLegs)break;if(used.has(c.gid))continue;
    if(cur*c.p<target)continue;
    legs.push({gid:c.gid,key:c.key,label:c.label,sport:c.sport,why:'Independent strong leg'});cur*=c.p;used.add(c.gid);sportsSeen.add(c.sport);}

  const pr=parlayProb(legs);return {legs,p:pr.p,indep:pr.indep};
}

function stubGame(L){if(!L.sport||!L.home)return null;return {id:L.gid,sport:L.sport,comp:L.comp||'',start:L.start||'',home:{abbr:L.home,name:L.home},away:{abbr:L.away,name:L.away},status:'closed'};}
function legResult(s,L){ // true | false | 'void' | null (pending / unknown)
  if(L.manual===true||L.manual===false)return L.manual;
  const g=gameById(L.gid);if(g&&isVoid(g))return 'void';
  if(g&&isFinal(g)){const r=evalActual(g,L.key);if(r!=null)return r;}
  const res=s.res&&s.res[L.gid];if(res&&!g){const st=stubGame(L);if(st){try{const r=evalMarket(st,L.key,res.h,res.a);if(r!=null)return r;}catch(e){}}}
  return null;}
function legNeedsManual(s,L){if(legResult(s,L)!==null)return false;if(L.custom)return true;const g=gameById(L.gid);if(g)return isFinal(g);
  const t=Date.parse(L.start||'');return isFinite(t)&&now()>t+3*3600e3;}
function parlayStatus(s){ // {st:'won'|'lost'|'void'|'pending', done, live}
  if(!s.legs||!s.legs.length)return {st:'void',done:0,live:0};let done=0,lost=false,voids=0;
  for(const L of s.legs){const r=legResult(s,L);if(r===true)done++;else if(r===false)lost=true;else if(r==='void')voids++;}
  const live=s.legs.length-voids;
  if(lost)return {st:'lost',done,live};if(!live)return {st:'void',done,live};if(done===live)return {st:'won',done,live};return {st:'pending',done,live};}

         ${need?`<div class="grade"><button type="button" data-grade="${i}|${j}|1">✓ hit</button><button type="button" data-grade="${i}|${j}|0">✗ missed</button></div>`:man?`<div class="grade"><button type="button" data-grade="${i}|${j}|x">Undo</button></div>`:''}</div></div>`;}).join('')}
     <div class="pcfoot"><div class="odds mono">${(+s.p||0)>0&&s.p<.01?pct(+s.p,s.p>=.001?1:2):pct(+s.p||0)}<small>Hit chance when saved${s.dec?' · bet at '+fmtPrice(s.dec):s.odds?' · bet at '+fmtPrice(am2dec(s.odds)):''}${s.stake>0?' · $'+s.stake+' stake':''}</small></div><button class="btn ghost" data-simmine="${i}">🎲 Simulate</button><button class="btn ghost" data-del="${i}">Remove</button></div></div>`;}).reverse();

  $('main').innerHTML=updatedLine()+`<h2>My parlays <small>${saved.length} saved</small></h2>`+sum+(rows.length?`<div class="grid">${rows.join('')}</div>`:`<div class="empty">Save a parlay from the builder and it will grade itself here as games finish.</div>`);
  $('main').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{saved.splice(+b.dataset.del,1);store.set('saved',saved);renderMine();});

}

// opt: {n, sports, minP, target, propsOnly, perPlayer, perGame, seed}
function ticketPool(o,hours){
  const pool=[];const lim=now()+hours*3600e3;
  for(const pl of (DATA.players||[])){const g=gameById(pl.gid);if(!g||!openG(g)||startMs(g)>lim||!o.sports.includes(g.sport)||pl.status!=='active'||(o.gids&&!o.gids.includes(g.id)))continue;
    const legs=playerLegs(pl).filter(x=>x.p>=o.minP);if(!legs.length)continue;
    // floor mode: safest line that still clears minP is the highest number with p>=minP; yield mode: line closest to target
    const L=o.target?legs.reduce((b,x)=>Math.abs(x.p-o.target)<Math.abs(b.p-o.target)?x:b):legs.sort((a,b)=>a.p-b.p)[0];
    pool.push({gid:g.id,key:L.key,label:L.label,p:L.p,sport:g.sport,who:pl.name,team:pl.team,stat:pl.stat,kind:'player',boost:pl.boost});}
  if(!o.propsOnly)for(const g of DATA.games){if(!priced(g)||startMs(g)>lim||!o.sports.includes(g.sport)||(o.gids&&!o.gids.includes(g.id)))continue;
    const best={};for(const m of marketsFor(g)){if(m.nopool)continue;const p=p1(g,m.key);if(p<o.minP||p>.95)continue;const sc=o.target?-Math.abs(p-o.target):-p;
      if(!best[m.group]||sc>best[m.group].sc)best[m.group]={gid:g.id,key:m.key,label:m.label,p,sport:g.sport,kind:'game',sc};}
    Object.values(best).forEach(x=>pool.push(x));}
  return pool;
}
function buildTicket(o){
  let hours=36,pool=ticketPool(o,hours);if(pool.length<o.n){hours=24*7;pool=ticketPool(o,hours);}
  else{for(const sp of o.sports){if(!pool.some(x=>x.sport===sp)){const extra=ticketPool({...o,sports:[sp]},24*7);if(extra.length){pool=pool.concat(extra);hours=24*7;}}}}
  let r=(o.seed||0)*7919+13;const rand=()=>{r=(r*9301+49297)%233280;return r/233280;};
  pool.forEach(x=>x.score=(o.target?-Math.abs(x.p-o.target):x.p)+(o.seed?rand()*.06:0)+(x.boost?.02:0));
  const bySport={};pool.sort((a,b)=>b.score-a.score).forEach(x=>(bySport[x.sport]=bySport[x.sport]||[]).push(x));
  const legs=[],perGame={},perWho={};const order=Object.keys(bySport);let guard=0;
  while(legs.length<o.n&&guard++<500){let added=false;
    for(const sp of order){if(legs.length>=o.n)break;const list=bySport[sp];
      const i=list.findIndex(x=>(perGame[x.gid]||0)<o.perGame&&(perWho[x.who]||0)<o.perPlayer&&!(x.kind==='player'&&legs.some(y=>y.kind==='player'&&y.gid===x.gid&&y.team===x.team&&y.stat===x.stat)));
      if(i<0)continue;const x=list.splice(i,1)[0];const before=legs.length?parlayProb(legs).p:1,after=parlayProb([...legs,x]).p;if(after<=0||(legs.length&&after>=before*.995))continue;  // contradicts the slip, or adds nothing (BAR win already covers "no draw")
      for(let j=legs.length-1;j>=0;j--){const y=legs[j];if(y.gid!==x.gid||y.kind==='player')continue;const rest=[...legs.slice(0,j),...legs.slice(j+1),x];
        if(parlayProb(rest).p<=after*1.005){legs.splice(j,1);perGame[y.gid]--;}}  // the new leg already covers this one
      legs.push(x);perGame[x.gid]=(perGame[x.gid]||0)+1;if(x.who)perWho[x.who]=(perWho[x.who]||0)+1;added=true;}
    if(!added)break;}
  const pr=parlayProb(legs);return {legs,p:pr.p,hours,n:o.n};
}

      const ok=LADDER[pl.stat].map(t=>({t,p:playerP(pl,t)})).filter(x=>x.p>=.86&&x.p<=.95);

// ---------------- your book's prices (soccer): refit every market to the 1X2 + O/U 2.5 (+BTTS) the user types ----------------
// Stored as decimals in store 'lines' = {gid:{h,d,a,o,u,by,bn,at}}. applyLines() puts g.line = de-vigged {H,D,A?,O,B?} on each
// game (also after every reload, which replaces the game objects); fitSoccer then uses fitLine(). No network, no odds feed.
let LINES=(()=>{const v=store.get('lines',{});return v&&typeof v==='object'&&!Array.isArray(v)?v:{};})();
function lineFrom(rec){ // raw decimals -> de-vigged line (shin) or {err}
  if(!rec)return null;const okp=x=>x>1&&isFinite(x),L={margin:{}};
  if(!okp(rec.o)||!okp(rec.u))return {err:'Over 2.5 and Under 2.5 are both needed.'};
  const two=(a,b,nm)=>{const S=1/a+1/b;if(S<.995||S>1.25)return `${nm}: these two prices imply ${pct(S,1)} in total. A real book is 100-125%; check you typed both from one book.`;return null;};
  let e=two(rec.o,rec.u,'Over/Under');if(e)return {err:e};
  [L.O]=noVig([rec.o,rec.u],'shin');L.margin.ou=1/rec.o+1/rec.u-1;
  const n3=[rec.h,rec.d,rec.a].filter(okp).length;
  if(n3===3){const S=1/rec.h+1/rec.d+1/rec.a;if(S<.995||S>1.35)return {err:`1X2: these prices imply ${pct(S,1)} in total. A real book is 100-135%.`};
    [L.H,L.D,L.A]=noVig([rec.h,rec.d,rec.a],'shin');L.margin.x12=S-1;}
  else if(n3)return {err:'Fill all three of Home, Draw and Away, or leave all three blank to use the provider\'s win chances.'};
  const nb=[rec.by,rec.bn].filter(okp).length;
  if(nb===2){e=two(rec.by,rec.bn,'BTTS');if(e)return {err:e};[L.B]=noVig([rec.by,rec.bn],'shin');L.margin.btts=1/rec.by+1/rec.bn-1;}
  else if(nb)return {err:'Fill both BTTS Yes and BTTS No, or neither.'};
  return L;}
function applyLines(d){ // put stored lines on a games array; prune lines for games long gone
  const ids=new Set(d.games.map(g=>g.id));let pruned=false;
  for(const gid of Object.keys(LINES)){const r=LINES[gid];if(!ids.has(gid)&&now()-(+r.at||0)>3*864e5){delete LINES[gid];pruned=true;}}
  if(pruned)store.set('lines',LINES);
  for(const g of d.games){if(g.sport!=='soccer')continue;const L=lineFrom(LINES[g.id]);if(L&&!L.err)g.line=L;else delete g.line;}}
function invalidateGame(g){for(const k of ['_m','_sm','_o','_mask','_pairs','_s'])delete g[k];pCache.clear();PCTX.clear();autoCache={};}
const lineMemo=new Map();
function fitLine(g){ // ρ on a grid, T bisected so P(over 2.5) = book; keep the ρ whose draw (and BTTS) best match
  const L=g.line,P=g.prob,t=P.home+P.away+(P.draw||0),H=L.H??P.home/t,D=L.D??(P.draw||0)/t,A=L.A??P.away/t,r=H/(H+A),O=L.O,B=L.B;
  const mk=[H,D,A,'L',O,B??''].join(',');if(lineMemo.has(mk))return lineMemo.get(mk);
  const S=new Float64Array(NC);
  const split=(T,rho)=>{let lo=.002,hi=.998,x,lh=0,la=0,rr=0;for(let i=0;i<36;i++){const s=(lo+hi)/2;lh=T*s;la=T-lh;rr=rhoOK(lh,la,rho);x=dcFill(lh,la,rr,0,S);(x.H/(x.H+x.A)<r)?lo=s:hi=s;}
    let o=0,b=0;for(let h=0;h<GN;h++)for(let a=0;a<GN;a++){const p=S[h*GN+a];if(h+a>2)o+=p;if(h&&a)b+=p;}return {lh,la,rho:rr,o,b,...x};};
  let best=null;
  for(let k=0;k<=50;k++){const rho=-.15+k*.005;let lo=1.2,hi=5,x;for(let i=0;i<30;i++){const T=(lo+hi)/2;x=split(T,rho);x.o<O?lo=T:hi=T;}
    const sc=(x.D-D)**2+(B!=null?(x.b-B)**2:0);if(!best||sc<best.sc)best={sc,x};}
  const x=best.x,m={kind:'goals',lh:x.lh,la:x.la,rho:x.rho,diag:0,method:'your book',
    err:Math.max(Math.abs(x.H-H),Math.abs(x.D-D),Math.abs(x.A-A),Math.abs(x.o-O),B!=null?Math.abs(x.b-B):0)};

// ---------------- same-game pairs (soccer): which two legs win together / pull apart, and their fair joint price ----------------
const PAIR_KEYS=['H','D','A','DC1X','DCX2','O1.5','O2.5','O3.5','U2.5','U3.5','BTTS','BTTSN','HO0.5','HO1.5','AO0.5','AO1.5','HCS','ACS','A+1.5','H+1.5'];
function pairFam(k){if(k.startsWith('G:'))return k;if(/^[OU]\d/.test(k))return 'tot';if(/^(H|D|A|DC1X|DCX2|DC12)$/.test(k))return 'res';if(k.startsWith('BTTS'))return 'btts';
  if(/^HO/.test(k)||k==='ACS')return 'hg';if(/^AO/.test(k)||k==='HCS')return 'ag';if(/\+1\.5$/.test(k))return 'hcp';return k;}
function bestPairs(g){
  if(g._pairs)return g._pairs;const keys=PAIR_KEYS.filter(k=>mkOf(g,k));
  try{if(LEGTYPES.has('G')&&window.__soccer&&__soccer.model){const R=__soccer.model(g.id); // top 2 anytime scorers per side
    for(const s of ['home','away']){const ps=((R&&R[s]&&R[s].players)||[]).map(x=>({k:'G:'+x.id,p:p1(g,'G:'+x.id)})).filter(x=>isFinite(x.p)&&x.p>0).sort((a,b)=>b.p-a.p).slice(0,2);for(const x of ps)keys.push(x.k);}}}catch(e){}
  const pr=[];
  for(let i=0;i<keys.length;i++)for(let j=i+1;j<keys.length;j++){const a=keys[i],b=keys[j];if(pairFam(a)===pairFam(b))continue;
    const pa=p1(g,a),pb=p1(g,b),pj=probOf(g,[a,b]);
    if(!(pj>=1e-6)||pj>=Math.min(pa,pb)-1e-6||pj<.1||pj>.9)continue; // exclusive, nested (one implies the other) or extreme
    const lift=pj/(pa*pb);if(isFinite(lift))pr.push({a,b,pa,pb,pj,lift});}
  pr.sort((x,y)=>y.lift-x.lift);
  return g._pairs={together:pr.filter(x=>x.lift>=1.05).slice(0,5),apart:pr.filter(x=>x.lift<=.85).slice(-3).reverse()};}
function pairsHTML(g,can){
  const P=bestPairs(g);if(!P.together.length&&!P.apart.length)return '';
  const lab=k=>legLabel({gid:g.id,key:k});
  const row=(x,add)=>`<div class="prow"><div class="pl">${esc(lab(x.a))} + ${esc(lab(x.b))}<small>${x.lift.toFixed(2)}× vs multiplying (${pct(x.pa)} × ${pct(x.pb)})</small></div><div class="pn">${pct(x.pj)}<small>${oddsFmt==='prob'?'together':'fair '+esc(fmtOdds(x.pj))}</small></div>${add&&can?`<button class="padd" type="button" data-pair="${esc(g.id+'|'+x.a+'|'+x.b)}" aria-label="${esc('Add '+lab(x.a)+' and '+lab(x.b))}">+</button>`:'<span></span>'}</div>`;
  return `<div class="sec">Best same-game pairs</div><div class="panel pairs" style="padding:4px 14px">
    ${P.together.length?`<div class="ts" style="margin:8px 0 2px">Win together</div>${P.together.map(x=>row(x,true)).join('')}`:''}
    ${P.apart.length?`<div class="ts" style="margin:10px 0 2px">Pull apart</div>${P.apart.map(x=>row(x,false)).join('')}`:''}
    <div class="note" style="margin-bottom:8px">Bet builders price these together and add a margin. If your book's same-game price beats our fair price, that's value. Model estimate.</div></div>`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pair]');if(!b)return;const [gid,a,c]=b.dataset.pair.split('|');let n=0;
  for(const k of [a,c])if(!inSlip(gid,k)&&toggleLeg(gid,k))n++;

  let html=`<div class="mkhead" style="cursor:default"><span>${esc(g.comp)}${g.tag?' · '+esc(g.tag):''}</span><span>${isFinal(g)?'Final':isVoid(g)?esc(String(g.status).toUpperCase()):esc(when(g))}</span></div>

let bookPx='',legPx={},stakeTxt='',bankroll=+store.get('bankroll',100)||100,kfrac=store.get('kellyFrac',.25);
if(!(kfrac>=0&&kfrac<=1))kfrac=.25;

function noVig(decs,method){ // fair probabilities from a book's prices. methods: multiplicative | additive | power | shin
  const q=decs.map(d=>1/d),S=q.reduce((a,b)=>a+b,0),n=q.length;
  if(method==='additive'){const r=q.map(x=>Math.max(1e-6,x-(S-1)/n)),t=r.reduce((a,b)=>a+b,0);return r.map(x=>x/t);}
  if(method==='power'){let lo=.01,hi=50;for(let i=0;i<80;i++){const k=(lo+hi)/2,t=q.reduce((a,x)=>a+Math.pow(x,k),0);t>1?lo=k:hi=k;}const k=(lo+hi)/2;return q.map(x=>Math.pow(x,k));}
  if(method==='shin'){const f=z=>q.map(x=>(Math.sqrt(z*z+4*(1-z)*x*x/S)-z)/(2*(1-z)));let lo=-.9,hi=.9;for(let i=0;i<80;i++){const z=(lo+hi)/2,t=f(z).reduce((a,b)=>a+b,0);t>1?lo=z:hi=z;}return f((lo+hi)/2);}
  return q.map(x=>x/S);}

function calcOT(){
  const kv=(l,v,c='')=>`<div class="kv ${c}"><span>${l}</span><b>${v}</b></div>`,bad=m=>`<div class="why">${m}</div>`,need='Enter odds like +150, -120, 2.5, 3/2 or 40%.';
  const set=(id,h)=>{const el=$(id);if(el)el.innerHTML=h;};
  // converter
  {const d=parseOdds(OT.conv);set('o-conv',d?kv('American',fmtPrice(d,'american'))+kv('Decimal',d.toFixed(3).replace(/0$/,''))+kv('Fractional',fmtPrice(d,'fractional'))+kv('Implied chance',pct(1/d,2))+kv('Profit on $100',money(100*(d-1))):bad(need));}
  // no-vig
  {const vals=(OT.nvN===3?OT.nv3:OT.nv2).map(parseOdds);
   if(vals.some(x=>!x))set('o-nv',bad(need));else{
    const S=vals.reduce((a,d)=>a+1/d,0),names=OT.nvN===3?['Home','Draw','Away']:['Side A','Side B'];
    const meth=[['multiplicative','Mult'],['additive','Add'],['power','Power'],['shin','Shin']].map(([k,l])=>[l,noVig(vals,k)]);
    set('o-nv',`<div class="kvs">${kv('Overround (book margin)',signPct(S-1,2),S>1?'':'kpos')}${kv('Hold',pct(1-1/S,2))}</div>
     <table class="nvt"><thead><tr><th>Side</th><th>Book</th>${meth.map(([l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${names.map((n,i)=>`<tr><td>${n}</td><td>${pct(1/vals[i],1)}<small>${fmtPrice(vals[i])}</small></td>${meth.map(([,P])=>`<td>${pct(P[i],1)}<small>${fmtOdds(P[i])}</small></td>`).join('')}</tr>`).join('')}</tbody></table>
     <div class="note">Mult = proportional. Add = equal margin off each side. Power and Shin take more margin off longshots (favourite-longshot bias). Fair prices shown in your odds format.</div>`);}}
  // EV + Kelly
  {const p=parseProb(OT.evP),d=parseOdds(OT.evO);
   if(!p)set('o-ev',bad('Enter your hit chance, like 55% or 0.55.'));else if(!d)set('o-ev',bad(need));else{
    const e=ev(p,d),st=bankroll*kelly(p,d,kfrac);
    set('o-ev',kv('Expected value per $1',signPct(e),e>0?'kpos':'kneg')+kv('Edge vs. break-even',`${p-1/d>=0?'+':'−'}${Math.abs((p-1/d)*100).toFixed(1)} pts`,e>0?'kpos':'kneg')+kv('Break-even chance at this price',pct(1/d,1))+kv('Fair price for your chance',fmtOdds(p))+kv('Min price for +EV',fmtOdds(p)+' or better')+kv('Min price for a 5% edge',fmtPrice(1.05/p)+' or better')+kv('Full Kelly',pct(kelly(p,d,1),1)+' of bankroll')+kv(`Stake at ${kfrac}× Kelly`,st>0?money(st):'No bet'));}}
  // parlay
  {const L=OT.par.map(x=>({d:parseOdds(x.o),p:parseProb(x.p),raw:x.o}));const ok=L.filter(x=>x.d);
   if(!ok.length)set('o-par',bad(need));else{
    const D=ok.reduce((a,x)=>a*x.d,1),stake=+String(OT.parStake).replace(/[^\d.]/g,'')||0,allP=ok.every(x=>x.p);
    let h=kv('Legs counted',`${ok.length} of ${L.length}`)+kv('Combined price',fmtPrice(D))+kv("Book's implied chance",pct(1/D,2))+kv(`Payout on ${money(stake)}`,money(stake*D))+kv('Profit if it hits',money(stake*(D-1)));
    if(allP){const P=ok.reduce((a,x)=>a*x.p,1),e=ev(P,D);h+=kv('Your hit chance (legs unrelated)',pct(P,2))+kv('Fair price',fmtOdds(P))+kv('Expected value per $1',signPct(e),e>0?'kpos':'kneg');}
    set('o-par',h+(allP?'':`<div class="note">Add your chance for every leg to see EV. Same-game legs aren't independent: use the parlay builder for those.</div>`));}}
  // arbitrage
  {const n=OT.arbN===3?3:2,vals=OT.arb.slice(0,n).map(parseOdds),T=+String(OT.arbStake).replace(/[^\d.]/g,'')||0;
   if(vals.some(x=>!x))set('o-arb',bad(need));else{
    const S=vals.reduce((a,d)=>a+1/d,0),ret=T/S;
    set('o-arb',kv('Implied chances add to',pct(S,2),S<1?'kpos':'kneg')+(S<1?kv('Arbitrage profit',`${signPct(1/S-1,2)} · ${money(ret-T)}`,'kpos'):kv('No arbitrage',`books keep ${pct(S-1,2)}`,'kneg'))+
     vals.map((d,i)=>kv(`Stake outcome ${i+1} (${fmtPrice(d)})`,money(T*(1/d)/S))).join('')+kv('Return whatever happens',money(ret),S<1?'kpos':'kneg'));}}
  // hedge
  {const S=+String(OT.hS).replace(/[^\d.]/g,'')||0,o1=parseOdds(OT.hO),o2=parseOdds(OT.hH);
   if(!o1||!o2)set('o-hedge',bad(need));else{
    const H=S*o1/o2,eq=S*o1-S-H,H0=S/(o2-1);
    set('o-hedge',kv('Equal-profit hedge stake',money(H))+kv('Profit either way',money(eq),eq>=0?'kpos':'kneg')+
      kv('Break-even hedge stake',money(H0))+kv('…profit if your bet wins',money(S*(o1-1)-H0),'kpos')+kv('…if the hedge wins',money(0))+
      kv('No hedge: win / lose',`${money(S*(o1-1))} / ${money(-S)}`));}}
}

// Feed hygiene: data.json is written by an outside job every hour. Anything that is not a games ARRAY is a failed fetch; bad
// entries are dropped or repaired (string probabilities coerced, missing comp filled) instead of breaking the page.
function sanitizeFeed(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.games))return null;
  const team=t=>t&&typeof t==='object'&&t.abbr!=null&&t.name!=null&&String(t.abbr).trim()&&String(t.name).trim();
  const games=[];
  for(const g of d.games){
    if(!g||typeof g!=='object'||typeof g.id!=='string'||!g.id||!SPORTNAME[g.sport]||!Number.isFinite(Date.parse(g.start))||!team(g.home)||!team(g.away))continue;
    g.home.abbr=String(g.home.abbr);g.home.name=String(g.home.name);g.away.abbr=String(g.away.abbr);g.away.name=String(g.away.name);
    if(!g.comp)g.comp=SPORTNAME[g.sport];else g.comp=String(g.comp);
    if(g.prob!=null){const P={};let bad=typeof g.prob!=='object';
      if(!bad)for(const k of ['home','away','draw']){if(g.prob[k]==null)continue;const v=+g.prob[k];if(!Number.isFinite(v)||v<0)bad=true;else P[k]=v;}
      if(bad||!(P.home>=0&&P.away>=0)||P.home+P.away+(P.draw||0)<=0||P.home+P.away<=0)delete g.prob;else g.prob=P;}
    if(g.total!=null){const t=+g.total;if(Number.isFinite(t)&&t>0)g.total=t;else delete g.total;}
    if(g.score!=null){const h=+(g.score&&g.score.home),a=+(g.score&&g.score.away);if(Number.isFinite(h)&&Number.isFinite(a))g.score={home:h,away:a};else delete g.score;}
    games.push(g);}
  d.games=games;return d;}
async function load(){ // -> true when DATA was replaced

  // scorers.json = optional goalscorer data for the soccer module (DATA.scorers = null when missing)
  // nbaroles.json + injuries.json = season averages and injury report: NBA games with no posted props get season-average
  // player legs from them (addRolePlayers); mypicks.json = the once-a-day My Parlay Picks made by the daily job
  let [d,pr,sc,ro,inj,mp,pf]=await Promise.all([get('data.json'),get('props.json'),get('scorers.json'),get('nbaroles.json'),get('injuries.json'),get('mypicks.json'),get('playerform.json')]);
